<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Supplyplan Workbench</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/styles.css"><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script></head><body>
<header class="topbar"><a class="wordmark" href="#"><svg viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="2" fill="none" stroke="#61D300" stroke-width="3"/><path d="M7 12h10" stroke="#61D300" stroke-width="2.5"/></svg><strong>supplyplan</strong></a><nav class="tabs"><button class="active">Workbench</button><button>Events</button><button>Data</button><button>Portfolio Management</button><button>Engine</button><button>Performance Management</button></nav><div class="top-actions"><button class="bot" aria-label="Assistant"><svg viewBox="0 0 24 24"><rect x="5" y="7" width="14" height="11" rx="3"/><path d="M12 4v3M8 12h.1M16 12h.1M9 15h6"/></svg></button><button id="help" class="round">?</button><button id="share" class="share" aria-label="Copy share link"><svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="2"/><circle cx="17" cy="6" r="2"/><circle cx="17" cy="18" r="2"/><path d="m8 11 7-4m-7 6 7 4"/></svg></button><button class="user"><span>BL</span> Bryan Leboff <b>⌄</b></button></div></header>
<section class="page-head"><div><button id="sidebarToggle" class="teal-icon collapse-icon" aria-label="Collapse filters"><svg viewBox="0 0 24 24"><path d="M4 6h12M4 12h8M4 18h12M20 8v8m0-8-4 4 4 4"/></svg></button><h1>Workbench</h1></div><div class="head-controls"><label class="switch"><input id="sync" type="checkbox" checked><i></i>Sync filters</label><span></span><button id="csv" class="icon-label"><svg viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M5 21h14"/></svg>Export</button><span></span><button id="upload" class="icon-label"><svg viewBox="0 0 24 24"><path d="M12 21V9m-4 4 4-4 4 4M5 3h14"/></svg>Upload</button><span></span><button id="refresh" class="square" aria-label="Refresh"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0 1 4M20 5v6h-6"/></svg></button><button id="save" disabled>Save adjustments</button></div></section>
<main class="layout"><aside id="sidebar" class="sidebar"><div class="filter-head"><h2>Filters</h2><div><button id="undo" disabled>↶</button><button id="redo" disabled>↷</button><button id="closeSidebar" class="close">×</button></div></div><div class="mini-cards"><div>UNIT OF MEASURE <b>‹ UNITS ›</b></div><div>PLAN VERSION <b>‹ 09/28/2026 ›</b></div></div><div class="scenario-panel"><label>Scenario<select id="preset"><option value="balanced">Balanced</option><option value="shock">Supply Shock</option><option value="surge">Demand Surge</option><option value="lead">Long Lead Times</option></select></label><label>Allocation policy<select id="policy"><option value="priority">Priority</option><option value="fair">Fair-share</option><option value="margin">Margin-max</option><option value="hybrid">Hybrid</option></select></label></div><div class="filter-scroll"><section><h3>⌄ SUPPLY SOURCES</h3><div id="plants"></div></section><section><h3>⌄ DEMAND SEGMENTS</h3><div id="segments"></div><label class="field">Demand multiplier<input id="demand" type="number"></label><label class="field">Seed<input id="seed" type="number"></label></section><section><h3>⌄ PLAN SETTINGS</h3><label class="field">Weeks<input id="weeks" type="number" min="8" max="52"></label><label class="field">Starting inventory<input id="inventory" type="number"></label><label class="field">Safety stock<input id="safety" type="number"></label><label class="field">Hybrid reserve %<input id="reserve" type="number"></label></section></div><div class="engine"><button id="exceptionsToggle"><strong>Engine status: StateCompleted</strong><b>⌃</b></button><div class="engine-legend"><span class="red"></span><i id="highCount">0</i><span class="yellow"></span><i id="safetyCount">0</i><span class="green"></span><i id="servedCount">0</i><span class="teal"></span><i id="constrainedCount">0</i><span class="blue"></span><i id="lostCount">0</i></div><ul id="exceptionList"></ul></div></aside>
<div class="workbench"><article class="card graph-card"><header><h2>Current Plan graph <i class="live"></i></h2><div class="card-controls"><label class="select-label">Plan Components<select id="components"><option>SHOW • All components</option><option>Capacity</option><option>Arrivals</option><option>On-hand</option></select></label><label>From<input id="graphFrom" type="date"></label><label>To<input id="graphTo" type="date"></label><button class="kebab">⋮</button><div class="segment" data-bucket="graph"><button data-value="1">1W</button><button data-value="4">1M</button><button data-value="13">1Q</button><button data-value="99">1Y</button></div><button class="teal-icon">⛶</button><button class="teal-icon">⌃</button></div></header><div class="chart-wrap"><canvas id="supplyChart"></canvas><div id="shortfallPop" class="shortfall-pop" hidden></div></div><div class="navigator"><canvas id="navChart"></canvas><div id="navWindow"></div></div></article>
<article class="card table-card"><header><h2>Current Plan Table <i class="live"></i></h2><div class="card-controls"><label class="select-label">Aggregations<select id="aggregation"><option value="segment">Segment</option><option value="plant">Plant</option><option value="total">Total</option></select></label><label class="select-label">Table View<select id="measure"><option value="shipped">Shipped | Demand</option><option value="demand">Demand</option><option value="lost">Lost Sales</option><option value="backlog">Backlog</option><option value="fill">Fill Rate</option></select></label><label>From<input id="tableFrom" type="date"></label><label>To<input id="tableTo" type="date"></label><div class="segment" data-bucket="table"><button data-value="1">1W</button><button data-value="4">1M</button><button data-value="13">1Q</button><button data-value="99">1Y</button></div><button id="recenter">Recenter</button><button class="teal-icon">⛶</button><button class="teal-icon">⌃</button></div></header><div id="planningGrid" class="planning-grid"></div></article></div></main><div id="toast" role="status"></div><script type="module" src="js/app.js"></script></body></html>
